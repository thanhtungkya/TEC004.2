services:
  - type: web
    name: housing-market-dashboard
    env: python
    region: oregon
    plan: free
    rootDir: .
    startCommand: "gunicorn --workers 2 --worker-class sync --timeout 30 --bind 0.0.0.0:$PORT app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: FLASK_ENV
        value: production
    buildCommand: "pip install -r requirements.txt"
